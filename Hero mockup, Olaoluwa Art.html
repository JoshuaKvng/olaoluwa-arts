<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero mockup, Olaoluwa Art</title>
<style>
  :root { --ink:#010101; --gold:#A56815; --paper:#F1F1F1; --muted:#CFCBC4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--paper); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  .stage { position: relative; height: 100vh; min-height: 620px; background: radial-gradient(ellipse at 50% 30%, #1a1510 0%, #010101 70%); overflow: hidden; }
  .glass { background: rgba(255,255,255,.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); }
  .topbar { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: min(92vw, 880px); height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 12px; z-index: 50; }
  .home { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--gold); background: rgba(255,255,255,.1); }
  .links { display: flex; gap: 30px; font-size: 14px; color: var(--muted); }
  .contact { background: var(--paper); color: var(--ink); border: 0; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 600; }
  .hero { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); text-align: center; width: min(92vw, 680px); z-index: 40; }
  .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(38px, 4.6vw, 58px); letter-spacing: .5px; }
  .hero h1 em { font-style: italic; color: var(--gold); }
  .hero p { margin: 12px auto 0; font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 480px; }
  .btns { margin-top: 20px; display: flex; gap: 12px; justify-content: center; }
  .btn { border-radius: 999px; padding: 12px 22px; font-size: 14px; font-weight: 600; border: 0; }
  .btn.white { background: var(--paper); color: var(--ink); }
  .btn.glass { color: var(--paper); }
  .deck { position: absolute; left: 0; right: 0; bottom: 118px; height: clamp(230px, calc(100vh - 500px), 360px); z-index: 10; }
  .card { position: absolute; left: 50%; bottom: 0; height: 100%; aspect-ratio: 3 / 4; border-radius: 20px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,.2); background: #111; transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .6s, filter .6s; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.back img { filter: brightness(.55) saturate(.8); }
  .card .meta, .card .counter, .card .expand { opacity: 0; transition: opacity .3s; }
  .card.active .meta, .card.active .counter, .card.active .expand { opacity: 1; }
  .meta { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(1,1,1,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .meta .t { font-family: Georgia, serif; font-size: 16px; }
  .meta .c { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .counter { position: absolute; top: 12px; right: 12px; font-size: 11px; padding: 5px 10px; border-radius: 999px; background: rgba(1,1,1,.5); }
  .expand { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 11px; padding: 6px 12px; border-radius: 999px; background: rgba(1,1,1,.5); white-space: nowrap; }
  .ctrl { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(92vw, 520px); height: 68px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 50; }
  .ctrl button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: var(--paper); font-size: 16px; cursor: pointer; }
  .thumb { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .thumb img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; }
  .thumb .n { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .thumb .s { font-size: 12px; color: var(--muted); }
  .tools { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 48px; border-radius: 999px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 50; font-size: 16px; color: var(--muted); }
  .note { position: absolute; left: 18px; bottom: 20px; font-size: 11px; color: #6f6a62; z-index: 50; }
  @media (max-width: 760px) {
    .links { display: none; } .tools { display: none; }
    .deck { bottom: 120px; }
    .meta .c { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="topbar glass">
    <div class="home">OA</div>
    <nav class="links"><span>Drawings</span><span>Paintings</span><span>Process</span><span>About</span></nav>
    <button class="contact">Contact</button>
  </header>

  <section class="hero">
    <h1>Olaoluwa <em>Art</em></h1>
    <p>Graphite portraits and paintings, commissioned and made to last.</p>
    <div class="btns">
      <button class="btn white">Explore drawings</button>
      <button class="btn glass">About</button>
    </div>
  </section>

  <div class="tools glass"><span>&#8599;</span><span>&#9825;</span><span>&#9675;</span></div>

  <div class="deck" id="deck"></div>

  <div class="ctrl glass">
    <button id="prev" aria-label="Previous">&#8592;</button>
    <div class="thumb"><img id="thumb" alt=""><div><div class="n" id="name"></div><div class="s">Drawings</div></div></div>
    <button id="heart" aria-label="Save">&#9825;</button>
    <button id="next" aria-label="Next">&#8594;</button>
  </div>

  <div class="note">Mockup. Works shown are cropped from the original phone photos.</div>
</main>

let active = 2;
const deck = document.getElementById('deck');

function render() {
  const spread = Math.min(window.innerWidth * 0.2, 210);
  deck.innerHTML = '';
  works.forEach((w, i) => {
    let d = i - active;
    const n = works.length;
    if (d > n / 2) d -= n;
    if (d < -n / 2) d += n;
    const abs = Math.abs(d);
    const isActive = d === 0;
    const scale = isActive ? 1 : Math.max(0.72, 1 - abs * 0.1);
    const card = document.createElement('div');
    card.className = 'card' + (isActive ? ' active' : ' back');
    card.style.transform = 'translateX(calc(-50% + ' + (d * spread) + 'px)) scale(' + scale + ')';
    card.style.zIndex = 20 - abs;
    card.style.opacity = abs > 2 ? 0 : (isActive ? 1 : 0.85 - abs * 0.15);
    card.style.pointerEvents = abs > 2 ? 'none' : 'auto';
    card.innerHTML =
      '<img src="' + w.src + '" alt="' + w.label + '">' +
      '<div class="expand">Expand</div>' +
      '<div class="counter">' + (i + 1) + ' / ' + n + '</div>' +
      '<div class="meta"><div class="t">' + w.label + '</div><div class="c">Placeholder caption. Replace with the artist\u2019s own note about the piece.</div></div>';
    card.addEventListener('click', () => { active = i; render(); });
    deck.appendChild(card);
  });
  document.getElementById('thumb').src = works[active].src;
  document.getElementById('name').textContent = works[active].label;
}

document.getElementById('prev').onclick = () => { active = (active - 1 + works.length) % works.length; render(); };
document.getElementById('next').onclick = () => { active = (active + 1) % works.length; render(); };
document.getElementById('heart').onclick = e => { e.currentTarget.innerHTML = e.currentTarget.innerHTML === '\u2665' ? '\u2661' : '\u2665'; };
window.addEventListener('resize', render);
render();
</script>
